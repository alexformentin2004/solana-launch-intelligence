name: Collect new Solana pools
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: solana-pool-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check collector enabled
        env:
          COLLECTOR_ENABLED: ${{ vars.COLLECTOR_ENABLED }}
        run: |
          if [ "$COLLECTOR_ENABLED" != "true" ]; then
            echo "::error::Repository variable COLLECTOR_ENABLED must be exactly true (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - name: Check secrets present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run auditor unit tests
        run: python -m unittest -v test_auditor.py
      - name: Poll new pools
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector.py
