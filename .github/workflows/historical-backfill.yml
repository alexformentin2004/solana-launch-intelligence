name: Historical candle backfill
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-backfill.yml'
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Pools per run (1-150)"
        default: "40"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: solana-historical-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Store historical candles in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL_BATCH_SIZE: ${{ github.event_name == 'push' && '150' || inputs.batch_size || '40' }}
        run: python historical_backfill.py
